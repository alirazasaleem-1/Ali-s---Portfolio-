<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b894" />
      <stop offset="100%" stop-color="#0984e3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="#0a0d14" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#111726" stroke="url(#grad)" stroke-width="2" />
  
  <!-- Symbol / Monogram AR with Glowing Dot -->
  <text x="32" y="41" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="25" font-weight="900" fill="url(#grad)" text-anchor="middle" letter-spacing="1">AR</text>
  
  <!-- Luminous Pulse Dot -->
  <circle cx="48" cy="18" r="4" fill="#00b894" filter="url(#glow)" />
  <circle cx="48" cy="18" r="2.5" fill="#55efc4" />
</svg>
